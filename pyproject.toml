[project]
name = "investmentagents"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "strands-agents-tools[a2a-client]>=0.8.9",
    "strands-agents[a2a,ollama,openai,otel]>=1.57.2",
    "mem0ai>=2.2.1",
    "chromadb>=1.5.9",
    "pandas>=3.0.6",
]

[tool.uv.workspace]
members = [
    "mcp-servers/simfin-fundamentals-data-server",
    "mcp-servers/finnhub-fundamentals-data-server",
    "mcp-servers/finnhub-news-data-server",
    "mcp-servers/reddit-news-data-server",
    "mcp-servers/google-news-data-server",
    "mcp-servers/duckduckgo-news-data-server",
    "mcp-servers/yfin-market-data-server",
    "mcp-servers/stockstats-market-data-server",
    "mcp-servers/mem0-server",
]

[dependency-groups]
dev = [
    "arize-phoenix>=20.3.0",
    "pre-commit>=4.5.1,<4.6.0",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
# Ruff owns linting and import sorting; Black owns formatting.
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["agents", "runtime", "utils", "models", "services"]

[tool.black]
target-version = ["py313"]
line-length = 88
