[project]
name = "google-news-data-server"
version = "0.1.0"
description = "MCP server providing Google News scraping data."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
	"mcp>=1.11.0",
	"pydantic>=2.11.7",
	"python-dateutil>=2.9.0.post0",
	"requests>=2.31.0",
	"beautifulsoup4>=4.12.3",
	"tenacity>=8.2.3",
]

[tool.setuptools]
packages = ["models", "services"]
