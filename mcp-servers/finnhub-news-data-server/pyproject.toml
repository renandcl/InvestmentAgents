[project]
name = "finnhub-news-server"
version = "0.1.0"
description = "MCP server providing news data from Finnhub."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "finnhub-python>=2.4.29",
    "mcp>=1.30.0",
    "pydantic>=2.13.5",
    "python-dateutil>=2.9.0.post0",
    "requests>=2.34.2",
]

[tool.setuptools]
packages = ["models", "services"]
