[project]
name = "duckduckgo-news-data-server"
version = "0.1.0"
description = "MCP server providing DuckDuckGo News search data."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
	"mcp>=1.30.0",
	"pydantic>=2.13.5",
	"python-dateutil>=2.9.0.post0",
	"ddgs>=9.16.0,<10.0.0",
]

[tool.setuptools]
packages = ["models", "services"]
