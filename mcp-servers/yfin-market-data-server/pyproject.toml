[project]
name = "yfin-market-data-server"
version = "0.1.0"
description = "MCP server providing on-demand Yahoo Finance historical OHLCV data."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mcp>=1.11.0",
    "pydantic>=2.11.7",
    "yfinance>=0.2.65",
]

[tool.setuptools]
packages = ["models", "services"]
